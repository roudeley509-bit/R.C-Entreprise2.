<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B1F4B"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>R.C ENTREPRISE</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy header band + single column of plain sections, bottom tab bar on phones. Navy / white / gold per the founders. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --ink:#0E1B3D; --muted:#56628A; --line:#DCE1EE;
  --navy:#0B1F4B; --navy2:#16306B; --gold:#B8862A; --gold-b:#D9AE45; --on-gold:#1A1303;
  --ok:#1E7A4C; --warn:#9A5B00; --bad:#B3261E; --tint:#EEF1F9;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081126; --surface:#101B3B; --ink:#EDF0FA; --muted:#9BA8CC; --line:#25335E;
  --gold:#E2B94E; --gold-b:#E2B94E; --ok:#4CC38A; --warn:#E5A23B; --bad:#FF8A80; --tint:#16234A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081126; --surface:#101B3B; --ink:#EDF0FA; --muted:#9BA8CC; --line:#25335E;
  --gold:#E2B94E; --gold-b:#E2B94E; --ok:#4CC38A; --warn:#E5A23B; --bad:#FF8A80; --tint:#16234A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--gold-b);color:var(--on-gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.02em;flex:none}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:.04em;font-size:1rem;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;letter-spacing:0;font-size:.72rem;opacity:.75}
.sp{flex:1}
.chip{border:1px solid rgba(255,255,255,.35);color:#fff;background:transparent;border-radius:999px;padding:6px 12px;font:600 .78rem var(--f-body);cursor:pointer}
.chip.on{background:var(--gold-b);color:var(--on-gold);border-color:var(--gold-b);padding:4px 10px;font-size:.7rem;white-space:nowrap}
main{display:flex;flex-direction:column;gap:22px;padding-block:22px}
.hero{background:var(--navy);color:#fff}
.hero .wrap{padding-block:34px 30px;display:flex;flex-direction:column;gap:16px}
.hero h1{font-size:clamp(1.9rem,7vw,2.8rem);max-width:15ch}
.hero h1 span{color:var(--gold-b)}
.hero p{max-width:46ch;opacity:.85}
.lead{color:var(--muted);max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font:700 .95rem var(--f-body);cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;min-height:44px}
.btn.gold{background:var(--gold-b);color:var(--on-gold)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold-b);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;min-width:0}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-family:var(--f-display);font-size:1.02rem}
.item .t span{color:var(--muted);font-size:.88rem}
.item .n{font-family:var(--f-display);font-weight:800;color:var(--gold);width:28px;flex:none}
.arrow{color:var(--gold);font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-weight:600;font-size:.86rem}
.field small{color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--navy2)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--tint);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-weight:800;font-size:1.6rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;background:var(--tint);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-b);border-radius:99px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.cells.big200{max-height:300px;overflow:auto;padding:2px}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;border:1.5px solid var(--line);font-size:.78rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.paid{background:var(--gold-b);border-color:var(--gold-b);color:var(--on-gold)}
.cell.pending{border-style:dashed;border-color:var(--gold);color:var(--gold)}
.cell.late{border-color:var(--bad);color:var(--bad)}
.cell.next{border-color:var(--navy2);color:var(--ink);box-shadow:0 0 0 2px var(--navy2)}
.note{border-left:4px solid var(--gold-b);background:var(--tint);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.9rem}
.note.bad{border-color:var(--bad)}
.muted{color:var(--muted)}
.sm{font-size:.86rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--navy);z-index:25;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex}
nav.tabs a{flex:1;text-align:center;color:#fff;opacity:.7;text-decoration:none;font-weight:700;font-size:.78rem;padding:12px 4px;position:relative}
nav.tabs a.on{opacity:1;color:var(--gold-b)}
nav.tabs a.on::after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;background:var(--gold-b);border-radius:0 0 3px 3px}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:.7rem;line-height:18px;margin-left:4px}
.scrim{position:fixed;inset:0;background:rgba(5,10,28,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.pay-opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.pay-opt:has(input:checked){border-color:var(--navy2);background:var(--tint)}
.pay-opt b{font-family:var(--f-display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:60;max-width:90%}
.tabsx{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tabsx button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 .85rem var(--f-body);cursor:pointer}
.tabsx button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.prod{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.prod .ph{aspect-ratio:4/3;border-radius:10px;background:var(--tint);display:grid;place-items:center;color:var(--muted);font-size:.8rem}
.pimg{display:block;aspect-ratio:4/3;width:100%;object-fit:cover;border-radius:10px;background:var(--tint)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--gold-b)}
.ap{display:flex;gap:10px;flex-wrap:wrap}
.ap .th{position:relative;display:inline-block}
.ap img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.ap .x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--bad);color:#fff;font:700 16px/1 var(--f-body);cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.foot{color:var(--muted);font-size:.85rem;padding-block:6px 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}}}
.htext{display:flex;flex-direction:column;gap:16px}
.hphoto{width:100%;height:auto;display:block;border-radius:18px;border:2px solid var(--gold-b);box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media(min-width:760px){.hwrap{flex-direction:row!important;align-items:center;gap:32px!important}.htext{flex:1}.hphoto{width:44%;max-width:460px}}
.hdr{width:78px;height:52px;object-fit:cover;object-position:40% 20%;border-radius:8px;border:1.5px solid var(--gold-b);flex:none}
.bal{background:#F26A1B;color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.bal .big{font-size:2rem}
.bal button{background:transparent;border:0;color:#fff;font-size:1.4rem;cursor:pointer;min-width:44px;min-height:44px}
.logo2{height:44px;width:auto;border-radius:8px;background:#fff;padding:3px;flex:none}

function calc(){
 var f=document.querySelector('[data-form=calc]');if(!f)return;
 var a=+f.buy.value||0,pr=+f.sell.value||0,pct=S.settings.pct||0,b=Math.round(a*pct/100),g=pr>0?Math.round(b/pr):0,tg=pr>0?Math.round((a+b)/pr):0;
 document.getElementById('kout').innerHTML='Benefis ('+(Math.round(pct*100)/100)+'%): <b>'+fmt(b)+'</b><br>Grenn nou mete sou li: <b>+'+g+' grenn</b><br>Total grenn ou vann: <b>'+tg+' grenn</b> a '+fmt(pr)+' chak<br>Revni: <b>'+fmt(a+b)+'</b> · Benefis: <b style="color:var(--ok)">'+fmt(b)+'</b>'
}
function openPay(ctx){modal={t:'pay',ctx:ctx};render()}

/* ---------- events ---------- */
document.addEventListener('click',async function(e){
 var g=e.target.closest('[data-go]');if(g){location.hash='#'+g.getAttribute('data-go');return}
 var t=e.target.closest('[data-act]');if(!t)return;
 var a=t.getAttribute('data-act'),id=t.getAttribute('data-id'),v=t.getAttribute('data-v');
 if(a==='scrim'){if(e.target===t){modal=null;render()}return}
 if(a==='close'){modal=null;render();return}
 if(a==='ktab'){kTab=v;render();return}
 if(a==='chtab'){chTab=v;render();return}
 if(a==='atab'){admTab=v;try{sessionStorage.setItem('rc-at',v)}catch(e){}render();return}
 if(a==='scat'){storeCat=v;render();return}
 if(a==='logout'){S.session=null;save();render();return}
 if(a==='adm'){adminOn=false;try{firebase.auth().signOut()}catch(e){}location.hash='#akey';render();return}
 if(a==='share'){try{await navigator.clipboard.writeText(SHARE_URL);toast('Lyen an kopye')}catch(x){toast('Kopye lyen an: '+SHARE_URL)}return}
 if(a==='copy'){try{await navigator.clipboard.writeText(v);toast('Nimewo a kopye')}catch(x){toast('Kopye nimewo a: '+v)}return}
 if(a==='prod'){modal={t:'prod',id:id,i:0};render();return}
 if(a==='pimg'){modal.i=+t.getAttribute('data-i');render();return}
 if(a==='pimgdel'){var pp=S.products.find(function(p){return p.id===id});if(pp&&pp.imgs){pp.imgs.splice(+t.getAttribute('data-i'),1);audit('Foto efase: '+pp.name);save();render()}return}
 if(a==='cart'){modal={t:'cart'};render();return}
 if(a==='cq'){var it=S.cart[+t.getAttribute('data-i')];it.qty+=+t.getAttribute('data-d');if(it.qty<1)S.cart.splice(+t.getAttribute('data-i'),1);save();render();return}
 if(a==='pay'){
  var k=t.getAttribute('data-kind'),amt=+t.getAttribute('data-amt');
  if(k==='order')openPay({kind:'order',orderId:+t.getAttribute('data-oid'),amt:amt,label:'kòmand #'+t.getAttribute('data-oid')});
  else{var c=S.carnets.find(function(c){return c.id===+t.getAttribute('data-cid')}),i=+t.getAttribute('data-idx');openPay({kind:'carnet',carnetId:c.id,index:i,amt:amt,label:def(c).name+' · '+stepLabel(c,i),multi:(c.type!=='pen'&&i>0),unit:def(c).unit.toLowerCase()})}
  return}
 if(a==='req-ans'){var r=S.requests.find(function(r){return r.id===+id});r.status=v;note(r.clientId,'Ou '+(v==='aksepte'?'aksepte':'refize')+' pwopozisyon an.');save();render();return}
 if(a==='pv'||a==='pr'){
  var p=S.payments.find(function(p){return p.id===+id});if(!p||p.status!=='pending')return;
  if(a==='pv'){
   var dup=S.payments.some(function(q){return q.id!==p.id&&q.status==='valid'&&p.ref&&q.ref&&q.ref.toLowerCase()===p.ref.toLowerCase()});
   if(dup){toast('Nimewo tranzaksyon sa a deja valide.');return}
   var cc=S.carnets.find(function(c){return c.id===p.carnetId});
   if(p.kind!=='order'&&cc&&cc.type!=='pen'&&p.index>0){var ci=document.getElementById('cnt-'+p.id),cn=ci?Math.floor(+ci.value):(p.count||1);if(!(cn>=1)||cn>def(cc).n-p.index+1){toast('Kantite a pa valab.');return}p.count=cn}
   p.status='valid';p.validatedAt=new Date().toISOString();
   if(p.kind==='order'){var o=S.orders.find(function(o){return o.id===p.orderId});if(o){o.paid=true;if(o.status==='nouvo')o.status='valide'}}
   note(p.clientId,'Peman '+fmt(p.amount)+' valide ('+payLabel(p)+').');audit('Peman #'+p.id+' valide ('+fmt(p.amount)+', '+cname(p.clientId)+')')
  }else{p.status='refused';note(p.clientId,'Peman '+fmt(p.amount)+' refize. Kontakte administratè a sou WhatsApp.');audit('Peman #'+p.id+' refize ('+cname(p.clientId)+')')}
  save();render();return}
 if(a==='wd'&&!adminOn&&!synced){toast('Pa gen entènèt. Eseye ankò.');return}
 if(a==='wd'){var wc=S.carnets.find(function(c){return c.id===+id&&c.clientId===S.session});if(!wc||wc.type==='pen')return;var inp=document.getElementById('wd-'+wc.id),amt=Math.round(+(inp&&inp.value));
  if(!(amt>0)){toast('Antre yon kantite.');return}
  if(amt>wdAvail(wc)){toast('Ou pa ka retire plis pase '+fmt(wdAvail(wc))+'.');return}
  S.withdrawals.push({id:uid('w'),carnetId:wc.id,clientId:wc.clientId,amount:amt,status:'attente',createdAt:new Date().toISOString()});audit('Demann retrè '+fmt(amt)+' · '+cname(wc.clientId)+' · '+def(wc).name);save();render();toast('Demann retrè voye.');return}
 if(a==='wdd'){var ww=S.withdrawals.find(function(w){return w.id===+id});if(!ww||ww.status!=='attente')return;ww.status=v;ww.decidedAt=new Date().toISOString();
  note(ww.clientId,v==='approuve'?'Retrè '+fmt(ww.amount)+' apwouve: kòb la voye ba ou.':'Demann retrè '+fmt(ww.amount)+' refize.');audit('Retrè #'+ww.id+' '+v+' ('+cname(ww.clientId)+')');save();render();return}
 if(a==='cedit'){var ce=S.clients.find(function(c){return c.id===+id});if(!ce)return;var n1=prompt('Prenon',ce.prenom);if(n1===null)return;var n2=prompt('Non',ce.nom);if(n2===null)return;var n3=prompt('Telefòn',ce.tel);if(n3===null)return;var n4=prompt('Adrès',ce.adr||'');if(n4===null)return;
  if(digits(n3)!==digits(ce.tel)&&S.clients.some(function(c){return c.id!==ce.id&&digits(c.tel)===digits(n3)})){toast('Telefòn sa a deja itilize.');return}
